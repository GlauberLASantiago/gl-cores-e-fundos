<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<defs>

    <filter id="blur24">
        <feGaussianBlur stdDeviation="50"/>
    </filter>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
        <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.3"/>
        <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
        <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>
    
</defs>

    <rect width="1920" height="1080" fill="#08090c"/>
    <polygon points="400,200 1800,700 1600,950 200,450" fill="url(#spectrum)" filter="url(#blur24)"/>
    
</svg>