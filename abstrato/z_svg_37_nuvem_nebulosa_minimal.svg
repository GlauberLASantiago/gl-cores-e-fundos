<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<defs>

    <filter id="nebulaBlur">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="noise"/>
        <feColorMatrix type="matrix" values="
            0 0 0 0 0.35
            0 0 0 0 0.15
            0 0 0 0 0.55
            0 0 0 0.3 0" in="noise" result="colored"/>
        <feGaussianBlur stdDeviation="30" in="colored"/>
    </filter>
    
</defs>

    <rect width="1920" height="1080" fill="#07070d"/>
    <rect width="1920" height="1080" filter="url(#nebulaBlur)"/>
    
</svg>