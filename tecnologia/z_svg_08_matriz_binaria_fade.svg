<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<defs>

    <pattern id="binaryGrid" width="36" height="36" patternUnits="userSpaceOnUse">
        <text x="18" y="24" font-family="monospace" font-size="11" fill="#0284c7" fill-opacity="0.2" text-anchor="middle">01</text>
    </pattern>
    <radialGradient id="binMask" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0.05"/>
    </radialGradient>
    <mask id="bMask"><rect width="1920" height="1080" fill="url(#binMask)"/></mask>
    
</defs>
<rect width="1920" height="1080" fill="#050811"/><rect width="1920" height="1080" fill="url(#binaryGrid)" mask="url(#bMask)"/>
</svg>